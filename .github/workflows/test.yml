name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checkver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python3 -m unittest discover -s tools/tests -v
